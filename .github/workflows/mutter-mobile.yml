name: Build Mutter Mobile (.deb)

on:
  workflow_run:
    workflows: ["Build GSD Mobile (.deb)"]
    types:
      - completed
  push:
    paths:
      - ".github/workflows/mutter-mobile.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    env:
      PKGVER: 48.0
      PKGREL: 2
      COMMIT: 48.mobile.0
      GVDB_COMMIT: b54bc5da25127ef416858a3ad92e57159ff565b3

    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            build-essential meson ninja-build pkg-config \
            libatk1.0-dev libcairo2-dev libdbus-1-dev \
            libfribidi-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libgnome-desktop-4-dev \
            libgraphene-1.0-dev libgtk-4-dev \
            libjson-glib-dev liblcms2-dev \
            libcanberra-gtk3-dev libdrm-dev \
            libgudev-1.0-dev libinput-dev \
            libx11-dev libxcb1-dev libxcomposite-dev \
            libxcursor-dev libxdamage-dev libxext-dev \
            libxfixes-dev libxi-dev libxrandr-dev \
            libxrender-dev libxtst-dev \
            libxkbcommon-dev libxkbfile-dev \
            mesa-common-dev libpango1.0-dev \
            libpipewire-0.3-dev \
            wayland-protocols libwayland-dev \
            xwayland wget \
            gobject-introspection libgirepository1.0-dev \
            gettext git gh libnm-dev libnma-dev libcolord-dev gettext intltool cmake \
            libei-dev libeis-dev libdisplay-info-dev libseat-dev libliftoff-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-res0-dev \
            libxcb-randr0-dev libxcb-sync-dev build-essential meson ninja-build pkg-config cmake \
            libatspi2.0-dev libcairo2-dev libdbus-1-dev libudev-dev libfribidi-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libgnome-desktop-4-dev libgirepository1.0-dev gobject-introspection \
            libgraphene-1.0-dev libgtk-4-dev libjson-glib-dev liblcms2-dev \
            libcanberra-gtk3-dev libdisplay-info-dev libdrm-dev \
            libei-dev libgudev-1.0-dev libinput-dev libwacom-dev \
            libice-dev libsm-dev libx11-dev libxau-dev libxcb1-dev \
            libxcomposite-dev libxcursor-dev libxdamage-dev \
            libxext-dev libxfixes-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxkbfile-dev libxrandr-dev \
            libxrender-dev libxtst-dev \
            mesa-common-dev libpango1.0-dev \
            libpipewire-0.3-dev \
            libwayland-dev wayland-protocols \
            python3-argcomplete python3-docutils \
            libstartup-notification0-dev \
            xserver-xorg-dev xwayland \
            gettext wget libxkbcommon-x11-dev

      # ✅ Ambil dari workflow sebelumnya (artifact, bukan release)
      - name: "📥 Download GSD"
        id: download_gsd
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "gsd" \
            --pattern "*gsd*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GSD
        run: |
          dpkg -i *.deb || apt -f install -y

      # ✅ Download source (explicit)
      - name: Download source
        run: |
          wget -O mutter.tar.gz \
            https://gitlab.gnome.org/verdre/mutter-mobile/-/archive/${COMMIT}/mutter-mobile-${COMMIT}.tar.gz

          wget -O gvdb.tar.gz \
            https://gitlab.gnome.org/GNOME/gvdb/-/archive/${GVDB_COMMIT}/gvdb-${GVDB_COMMIT}.tar.gz

      # ✅ Extract aman
      - name: Extract
        run: |
          tar -xzf mutter.tar.gz
          mkdir gvdb
          tar -xzf gvdb.tar.gz -C gvdb --strip-components=1

      # ✅ Prepare
      - name: Prepare
        run: |
          cd mutter-mobile-${COMMIT}
          mkdir -p subprojects/gvdb
          cp -r ../gvdb/* subprojects/gvdb/

      # ✅ Build
      - name: Build
        run: |

          # fix pkg-config path
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

          # fix udev naming mismatch
          ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/libudev.pc \
                /usr/lib/x86_64-linux-gnu/pkgconfig/udev.pc || true

          # debug
          pkg-config --modversion libudev || true

          # fix udev pkg-config missing variable
          echo "udevdir=/usr/lib/udev" >> /usr/lib/x86_64-linux-gnu/pkgconfig/libudev.pc

          # optional debug
          pkg-config --variable=udevdir libudev || true

          cd mutter-mobile-${COMMIT}

          meson setup build \
            -Dudev=true \
            -Dnative_backend=true \
            -Dintrospection=true \
            -Dxwayland_path=/usr/bin/Xwayland \
            -Dremote_desktop=true \
            -Dtests=disabled

          meson compile -C build

      # ✅ Install staging (tanpa sudo)
      - name: Install
        run: |
          cd mutter-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      # ✅ Package .deb
      - name: Pack deb
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r mutter-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat <<EOF > deb/DEBIAN/control
          Package: mutter-mobile
          Version: ${PKGVER}-${PKGREL}
          Architecture: amd64
          Maintainer: Newbyte
          Depends: gnome-settings-daemon-mobile
          Description: Mutter Mobile (Debian Trixie build)
          EOF

          dpkg-deb --build deb mutter-mobile.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutter
          path: "*.deb"