name: Build Mutter Mobile (.deb)

on:
  workflow_run:
    workflows: ["Build GSD Mobile (.deb)"]
    types:
      - completed
    paths:
      - ".github/workflows/mutter-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: debian:trixie

    env:
      PKGVER: 50.3
      PKGREL: 1
      COMMIT: 50.3
      GVDB_COMMIT: b54bc5da25127ef416858a3ad92e57159ff565b3

    steps:
      - name: Install dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources

          apt-get update

          apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config git gh

          apt-get build-dep -y \
            gnome-shell \
            mutter \
            gnome-settings-daemon

          mkdir -p /usr/share/dbus-1/interfaces
          ln -s /usr/share/dbus-1/interfaces/org.gnome.Sysprof.Profiler.xml \
                /usr/share/dbus-1/interfaces/org.gnome.Sysprof3.Profiler.xml || true

      # ✅ Ambil dari workflow sebelumnya (artifact, bukan release)
      - name: "📥 Download GSD"
        id: download_gsd
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "gsd-50.3" \
            --pattern "*gsd*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GSD
        run: |
          apt-get install -y ./*.deb \
            -o Dpkg::Options::="--force-overwrite"

          pkg-config --modversion gnome-settings-daemon || true

      # ✅ Download source (explicit)
      # - name: Download source
      #   run: |
      #     wget -O mutter.tar.gz \
      #       https://gitlab.gnome.org/verdre/mutter-mobile/-/archive/${COMMIT}/mutter-mobile-${COMMIT}.tar.gz

      #     wget -O gvdb.tar.gz \
      #       https://gitlab.gnome.org/GNOME/gvdb/-/archive/${GVDB_COMMIT}/gvdb-${GVDB_COMMIT}.tar.gz

      - name: Clone source
        run: |
          git clone --recursive \
            https://gitlab.gnome.org/World/MobileShell/mutter-mobile.git -b mobile-shell-devel-50 \
            mutter-mobile-${COMMIT}

          cd mutter-mobile-${COMMIT}
          git submodule update --init --recursive

      # ✅ Extract aman
      # - name: Extract
      #   run: |
      #     tar -xzf mutter.tar.gz
      #     mkdir gvdb
      #     tar -xzf gvdb.tar.gz -C gvdb --strip-components=1

      # ✅ Prepare
      # - name: Prepare
      #   run: |
      #     cd mutter-mobile-${COMMIT}
      #     mkdir -p subprojects/gvdb
      #     cp -r ../gvdb/* subprojects/gvdb/

      # ✅ Build
      - name: Build
        run: |

          # # fix pkg-config path
          # export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

          # # fix udev naming mismatch
          # ln -s /usr/lib/aarch64-linux-gnu/pkgconfig/libudev.pc \
          #       /usr/lib/aarch64-linux-gnu/pkgconfig/udev.pc || true

          # # debug
          # pkg-config --modversion libudev || true

          # # fix udev pkg-config missing variable
          # echo "udevdir=/usr/lib/udev" >> /usr/lib/aarch64-linux-gnu/pkgconfig/libudev.pc

          # # optional debug
          # pkg-config --variable=udevdir libudev || true

          cd mutter-mobile-${COMMIT}

          meson setup build \
            --prefix=/usr \
            -Dudev=true \
            -Dnative_backend=true \
            -Dintrospection=true \
            -Dxwayland_path=/usr/bin/Xwayland \
            -Dremote_desktop=true \
            -Dtests=disabled

          meson compile -C build

      # ✅ Install staging (tanpa sudo)
      - name: Install
        run: |
          cd mutter-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      # ✅ Package .deb
      - name: Pack deb
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r mutter-mobile-${COMMIT}/pkg/* deb/

          cat <<EOF > deb/DEBIAN/control
          Package: mutter
          Version: ${PKGVER}-${PKGREL}
          Architecture: arm64
          Maintainer: Newbyte
          Depends: gnome-settings-daemon
          Description: Mutter Mobile (Debian Trixie build)
          EOF

          dpkg-deb --build deb mutter-mobile.deb

      - name: "📤 上传构建产物"
        uses: actions/upload-artifact@v4
        with:
          name: mutter
          path: "*.deb"
          retention-days: 7
          if-no-files-found: error

      - name: "🏷️ 创建GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mutter-50.3
          name: "mutter"
          body: |
            🧩 mutter
          draft: false
          prerelease: false
          files: "*.deb"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}