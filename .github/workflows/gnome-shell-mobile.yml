name: Build GNOME Shell Mobile (.deb)

on:
  workflow_run:
    workflows: ["Build Mutter Mobile (.deb)"]
    types:
      - completed
  push:
    paths:
      - ".github/workflows/gnome-shell-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    env:
      PKGVER: 48.0
      PKGREL: 6
      COMMIT: 48.mobile.0
      GVC_COMMIT: 47c47a423ff2f55bb038d92517e4782cf051496a

    steps:
      # 🔹 Base tools
      - name: Install base tools
        run: |
          apt update
          apt install -y \
            git wget curl ca-certificates gnupg

      # 🔹 Build dependencies (Trixie)
      - name: Install dependencies
        run: |
          apt install -y \
            build-essential meson ninja-build pkg-config cmake \
            python3 python3-setuptools python3-docutils \
            gettext unzip \
            gobject-introspection libgirepository1.0-dev \
            libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev \
            libgjs-dev \
            libxml2-dev \
            libpolkit-agent-1-dev \
            libgnome-desktop-4-dev \
            libpango1.0-dev \
            libecal2.0-dev libedataserver1.2-dev \
            libgcr-4-dev \
            libx11-dev \
            libnm-dev libsecret-1-dev \
            libpipewire-0.3-dev \
            libsystemd-dev systemd \
            libpulse-dev libasound2-dev \
            libstartup-notification0-dev \
            gsettings-desktop-schemas-dev \
            gjs \
            pulseaudio pipewire-pulse \
            xcvt gh libatk1.0-dev libatk-bridge2.0-dev \
            libcolord-dev \
            liblcms2-dev \
            libei-dev \
            libdisplay-info-dev \
            libcanberra-gtk3-dev \
            libgudev-1.0-dev \
            libwacom-dev \
            libx11-xcb-dev \
            libxcb-res0-dev \
            libxcb-randr0-dev \
            libxkbfile-dev \
            libxkbcommon-x11-dev \
            libinput-dev \
            libgbm-dev \
            libdrm-dev libeis-dev \
            build-essential meson ninja-build pkg-config \
            libatk1.0-dev libcairo2-dev libdbus-1-dev \
            libfribidi-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libgnome-desktop-4-dev \
            libgraphene-1.0-dev libgtk-4-dev \
            libjson-glib-dev liblcms2-dev \
            libcanberra-gtk3-dev libdrm-dev \
            libgudev-1.0-dev libinput-dev \
            libx11-dev libxcb1-dev libxcomposite-dev \
            libxcursor-dev libxdamage-dev libxext-dev \
            libxfixes-dev libxi-dev libxrandr-dev \
            libxrender-dev libxtst-dev \
            libxkbcommon-dev libxkbfile-dev \
            mesa-common-dev libpango1.0-dev \
            libpipewire-0.3-dev \
            wayland-protocols libwayland-dev \
            xwayland wget \
            gobject-introspection libgirepository1.0-dev \
            gettext git gh libnm-dev libnma-dev libcolord-dev gettext intltool cmake \
            libei-dev libeis-dev libdisplay-info-dev libseat-dev libliftoff-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-res0-dev \
            libxcb-randr0-dev libxcb-sync-dev build-essential meson ninja-build pkg-config cmake \
            libatspi2.0-dev libcairo2-dev libdbus-1-dev libudev-dev libfribidi-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libgnome-desktop-4-dev libgirepository1.0-dev gobject-introspection \
            libgraphene-1.0-dev libgtk-4-dev libjson-glib-dev liblcms2-dev \
            libcanberra-gtk3-dev libdisplay-info-dev libdrm-dev \
            libei-dev libgudev-1.0-dev libinput-dev libwacom-dev \
            libice-dev libsm-dev libx11-dev libxau-dev libxcb1-dev \
            libxcomposite-dev libxcursor-dev libxdamage-dev \
            libxext-dev libxfixes-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxkbfile-dev libxrandr-dev \
            libxrender-dev libxtst-dev \
            mesa-common-dev libpango1.0-dev \
            libpipewire-0.3-dev \
            libwayland-dev wayland-protocols \
            python3-argcomplete python3-docutils \
            libstartup-notification0-dev \
            xserver-xorg-dev xwayland \
            gettext wget libxkbcommon-x11-dev libgbm-dev libsysprof-6-dev libgl-dev \
            libegl-dev libgles2-mesa-dev libglvnd-dev libwayland-egl-backend-dev xkb-data libxcb-randr0-dev libsysprof-capture-4-dev libevdev-dev sysprof \
            xcvt libnm-dev libsecret-1-dev libsystemd-dev systemd-dev

      # 🔥 Download MUTTER
      - name: "📥 Download MUTTER"
        id: download_mutter
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "mutter" \
            --pattern "*mutter*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Download GSD
      - name: "📥 Download GSD"
        id: download_gsd
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "gsd" \
            --pattern "*gsd*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Install dependency deb
      - name: Install local deb
        run: |
          dpkg -i *.deb || apt -f install -y

      # 🔍 Debug (penting)
      - name: Verify mutter pkg-config
        run: |
          pkg-config --list-all | grep mutter || true
          pkg-config --modversion mutter-clutter-16

      # 🔥 Download source
      - name: Download source
        run: |
          wget -O gnome-shell-mobile.tar.gz \
            https://gitlab.gnome.org/verdre/gnome-shell-mobile/-/archive/${COMMIT}/gnome-shell-mobile-${COMMIT}.tar.gz

          wget -O gvc.tar.gz \
            https://gitlab.gnome.org/GNOME/libgnome-volume-control/-/archive/${GVC_COMMIT}/libgnome-volume-control-${GVC_COMMIT}.tar.gz

          tar -xzf gnome-shell-mobile.tar.gz

          mkdir gvc
          tar -xzf gvc.tar.gz -C gvc --strip-components=1

      # 🔧 Prepare
      - name: Prepare
        run: |
          cd gnome-shell-mobile-${COMMIT}
          mkdir -p subprojects/gvc
          cp -r ../gvc/* subprojects/gvc/

      # 🚀 Build
      - name: Build
        run: |
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

          cd gnome-shell-mobile-${COMMIT}

          # fix systemd pkg-config name mismatch
          ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/libsystemd.pc \
                /usr/lib/x86_64-linux-gnu/pkgconfig/systemd.pc || true

          pkg-config --modversion systemd || true

          mkdir -p /usr/lib/x86_64-linux-gnu/pkgconfig

          cat <<EOF | sudo tee /usr/lib/x86_64-linux-gnu/pkgconfig/systemd.pc
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib/x86_64-linux-gnu
          includedir=\${prefix}/include

          Name: systemd
          Description: systemd
          Version: 253
          Libs: -lsystemd
          Cflags: -I\${includedir}

          systemduserunitdir=/usr/lib/systemd/user
          systemdsystemunitdir=/usr/lib/systemd/system
          EOF

          pkg-config --variable=systemduserunitdir systemd

          meson setup build \
            --prefix=/usr \
            -Dsystemd=true \
            -Dnetworkmanager=true \
            -Dcamera_monitor=false \
            -Dtests=false

          meson compile -C build

      # 📦 Install
      - name: Install
        run: |
          cd gnome-shell-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      # 🧹 Cleanup
      - name: Cleanup
        run: |
          cd gnome-shell-mobile-${COMMIT}
          rm -f pkg/usr/share/applications/org.gnome.Extensions.desktop || true

      # 📦 Create DEB
      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r gnome-shell-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat <<EOF > deb/DEBIAN/control
          Package: gnome-shell-mobile
          Version: ${PKGVER}-${PKGREL}
          Architecture: amd64
          Maintainer: Newbyte
          Depends: mutter-mobile, gnome-settings-daemon-mobile, pipewire-pulse | pulseaudio
          Description: GNOME Shell Mobile (systemd)
          EOF

          dpkg-deb --build deb gnome-shell-mobile.deb

      # 📤 Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-shell
          path: "*.deb"

      # 🏷️ Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gnome-shell-${{ github.run_number }}
          name: GNOME Shell Mobile
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}