name: Build GNOME Shell Mobile (.deb)

on:
  workflow_run:
    workflows: ["Build Mutter Mobile (.deb)"]
    types:
      - completed
  push:
    paths:
      - ".github/workflows/gnome-shell-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    env:
      PKGVER: 48.0
      PKGREL: 6
      COMMIT: 48.mobile.0
      GVC_COMMIT: 47c47a423ff2f55bb038d92517e4782cf051496a

    steps:
      # 🔹 Base tools
      - name: Install base tools
        run: |
          apt update
          apt install -y \
            git wget curl ca-certificates gnupg

      # 🔹 Build dependencies (Trixie)
      - name: Install dependencies
        run: |
          apt install -y \
            build-essential meson ninja-build pkg-config cmake \
            python3 python3-setuptools python3-docutils \
            gettext unzip \
            gobject-introspection libgirepository1.0-dev \
            libglib2.0-dev \
            libgtk-4-dev libadwaita-1-dev \
            libgjs-dev \
            libxml2-dev \
            libpolkit-agent-1-dev \
            libgnome-desktop-4-dev \
            libpango1.0-dev \
            libecal2.0-dev libedataserver1.2-dev \
            libgcr-4-dev \
            libx11-dev \
            libnm-dev libsecret-1-dev \
            libpipewire-0.3-dev \
            libsystemd-dev systemd \
            libpulse-dev libasound2-dev \
            libstartup-notification0-dev \
            gsettings-desktop-schemas-dev \
            gjs \
            pulseaudio pipewire-pulse \
            xcvt gh libatk1.0-dev

      # 🔥 Download MUTTER
      - name: "📥 Download MUTTER"
        id: download_mutter
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "mutter" \
            --pattern "*mutter*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Download GSD
      - name: "📥 Download GSD"
        id: download_gsd
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "gsd" \
            --pattern "*gsd*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Install dependency deb
      - name: Install local deb
        run: |
          dpkg -i *.deb || apt -f install -y

      # 🔍 Debug (penting)
      - name: Verify mutter pkg-config
        run: |
          pkg-config --list-all | grep mutter || true
          pkg-config --modversion mutter-clutter-16

      # 🔥 Download source
      - name: Download source
        run: |
          wget -O gnome-shell-mobile.tar.gz \
            https://gitlab.gnome.org/verdre/gnome-shell-mobile/-/archive/${COMMIT}/gnome-shell-mobile-${COMMIT}.tar.gz

          wget -O gvc.tar.gz \
            https://gitlab.gnome.org/GNOME/libgnome-volume-control/-/archive/${GVC_COMMIT}/libgnome-volume-control-${GVC_COMMIT}.tar.gz

          tar -xzf gnome-shell-mobile.tar.gz

          mkdir gvc
          tar -xzf gvc.tar.gz -C gvc --strip-components=1

      # 🔧 Prepare
      - name: Prepare
        run: |
          cd gnome-shell-mobile-${COMMIT}
          mkdir -p subprojects/gvc
          cp -r ../gvc/* subprojects/gvc/

      # 🚀 Build
      - name: Build
        run: |
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

          cd gnome-shell-mobile-${COMMIT}

          meson setup build \
            --prefix=/usr \
            -Dsystemd=true \
            -Dnetworkmanager=false \
            -Dcamera_monitor=false \
            -Dtests=false

          meson compile -C build

      # 📦 Install
      - name: Install
        run: |
          cd gnome-shell-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      # 🧹 Cleanup
      - name: Cleanup
        run: |
          cd gnome-shell-mobile-${COMMIT}
          rm -f pkg/usr/share/applications/org.gnome.Extensions.desktop || true

      # 📦 Create DEB
      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r gnome-shell-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat <<EOF > deb/DEBIAN/control
          Package: gnome-shell-mobile
          Version: ${PKGVER}-${PKGREL}
          Architecture: amd64
          Maintainer: Newbyte
          Depends: mutter-mobile, gnome-settings-daemon-mobile, pipewire-pulse | pulseaudio
          Description: GNOME Shell Mobile (systemd)
          EOF

          dpkg-deb --build deb gnome-shell-mobile.deb

      # 📤 Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-shell
          path: "*.deb"

      # 🏷️ Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gnome-shell-${{ github.run_number }}
          name: GNOME Shell Mobile
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}