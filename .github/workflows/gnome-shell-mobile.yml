name: Build GNOME Shell Mobile (.deb)

on:
  workflow_run:
    workflows: ["Build Mutter Mobile (.deb)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        os: [debian]
        
    container:
      image: debian:forky

    env:
      # Pakai versi lebih tinggi dari paket Debian agar tidak dianggap downgrade saat nanti diinstall
      PKGVER: 51.0
      PKGREL: 7
      COMMIT: mobile
      GVC_COMMIT: 48c170f7ec6f58dbb1b566dbd873d6af49b3c2ca

    steps:
      - name: Install base tools
        run: |
          apt-get update

          apt-get install -y \
            git \
            wget \
            curl \
            ca-certificates \
            gnupg

      - name: Install build dependencies
        run: |
          if [ -f /etc/apt/sources.list.d/debian.sources ]; then
            sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          fi

          apt-get update

          apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            cmake \
            git \
            libglycin-2-dev

          apt-get build-dep -y \
            gnome-shell \
            mutter \
            gnome-settings-daemon

          # Install GitHub CLI (gh) manually since it is not in Debian Forky
          wget https://github.com/cli/cli/releases/download/v2.54.0/gh_2.54.0_linux_arm64.tar.gz
          tar xzf gh_*_linux_arm64.tar.gz
          cp gh_*_linux_arm64/bin/gh /usr/local/bin/

      - name: Download Mutter Mobile deb
        run: |
          mkdir -p deps/mutter

          gh release download "mutter-${{ matrix.os }}" \
            --pattern "*mutter*.deb" \
            --repo "${{ github.repository }}" \
            --dir deps/mutter \
            --clobber

          echo "Downloaded Mutter packages:"
          ls -lah deps/mutter

          DEB_COUNT=$(ls -1 deps/mutter/*.deb 2>/dev/null | wc -l)

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "Error: no Mutter .deb downloaded"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download GSD Mobile deb
        run: |
          mkdir -p deps/gsd

          gh release download "gsd-${{ matrix.os }}" \
            --pattern "*.deb" \
            --repo "${{ github.repository }}" \
            --dir deps/gsd \
            --clobber

          echo "Downloaded GSD packages:"
          ls -lah deps/gsd

          DEB_COUNT=$(ls -1 deps/gsd/*.deb 2>/dev/null | wc -l)

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "Error: no GSD .deb downloaded"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GSD and Mutter Mobile
        run: |
          echo "GSD packages:"
          for deb in deps/gsd/*.deb; do
            echo "== $deb =="
            dpkg-deb -f "$deb" Package Version Architecture || true
          done

          echo "Mutter packages:"
          for deb in deps/mutter/*.deb; do
            echo "== $deb =="
            dpkg-deb -f "$deb" Package Version Architecture || true
          done

          echo "Install GSD Mobile first"
          apt-get install -y ./deps/gsd/*.deb \
            --allow-downgrades \
            -o Dpkg::Options::="--force-overwrite"

          echo "Install Mutter Mobile"
          apt-get install -y ./deps/mutter/*.deb \
            --allow-downgrades \
            -o Dpkg::Options::="--force-overwrite"

          mkdir -p /tmp/mobile-pkgconfig

          echo "Create gnome-settings-daemon.pc override"
          GSD_PC="$(pkg-config --path gnome-settings-daemon)"

          echo "Original GSD pc file: $GSD_PC"
          cat "$GSD_PC"

          cp "$GSD_PC" /tmp/mobile-pkgconfig/gnome-settings-daemon.pc
          sed -i 's/^Version:.*/Version: 51.0/' /tmp/mobile-pkgconfig/gnome-settings-daemon.pc

          echo "Create systemd.pc override"
          cat > /tmp/mobile-pkgconfig/systemd.pc <<'EOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib/aarch64-linux-gnu
          includedir=${prefix}/include

          Name: systemd
          Description: systemd
          Version: 257
          Libs: -lsystemd
          Cflags: -I${includedir}

          systemduserunitdir=/usr/lib/systemd/user
          systemdsystemunitdir=/usr/lib/systemd/system
          EOF

          echo "PKG_CONFIG_PATH=/tmp/mobile-pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"

          export PKG_CONFIG_PATH=/tmp/mobile-pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

          echo "Verify pkg-config after override:"
          pkg-config --path gnome-settings-daemon
          pkg-config --modversion gnome-settings-daemon
          pkg-config --modversion libmutter-51
          pkg-config --modversion mutter-clutter-51
          pkg-config --modversion mutter-mtk-51
          pkg-config --modversion mutter-cogl-51
          pkg-config --variable=systemduserunitdir systemd

          test "$(pkg-config --modversion gnome-settings-daemon)" = "51.0"
          test "$(pkg-config --modversion libmutter-51)" = "51.0"

      - name: Clone GNOME Shell Mobile source
        run: |
          git clone --recursive \
            https://gitlab.gnome.org/World/MobileShell/gnome-shell-mobile.git \
            -b mobile \
            gnome-shell-mobile-${COMMIT}

          cd gnome-shell-mobile-${COMMIT}
          git checkout ${COMMIT}
          git submodule update --init --recursive

      - name: Verify pkg-config dependencies
        run: |
          export PKG_CONFIG_PATH=/tmp/mobile-pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

          echo "GSD:"
          pkg-config --path gnome-settings-daemon
          pkg-config --modversion gnome-settings-daemon

          echo "Mutter:"
          pkg-config --modversion libmutter-51
          pkg-config --modversion mutter-clutter-51
          pkg-config --modversion mutter-mtk-51
          pkg-config --modversion mutter-cogl-51

          echo "Systemd:"
          pkg-config --modversion systemd
          pkg-config --variable=systemduserunitdir systemd
          pkg-config --variable=systemdsystemunitdir systemd

          echo "libmutter cflags:"
          pkg-config --cflags libmutter-51

          test "$(pkg-config --modversion gnome-settings-daemon)" = "51.0"
          test "$(pkg-config --modversion libmutter-51)" = "51.0"

      - name: Build GNOME Shell Mobile
        run: |
          export PKG_CONFIG_PATH=/tmp/mobile-pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

          cd gnome-shell-mobile-${COMMIT}

          meson setup build \
            --prefix=/usr \
            -Dsystemd=true \
            -Dnetworkmanager=true \
            -Dcamera_monitor=false \
            -Dtests=false

          meson compile -C build

      - name: Install to staging
        run: |
          cd gnome-shell-mobile-${COMMIT}
          DESTDIR="$(pwd)/pkg" meson install -C build

      - name: Cleanup staging
        run: |
          cd gnome-shell-mobile-${COMMIT}

          rm -f pkg/usr/share/applications/org.gnome.Extensions.desktop || true

      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN deb/usr

          cp -r gnome-shell-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat > deb/DEBIAN/control <<EOF
          Package: gnome-shell
          Version: ${PKGVER}-${PKGREL}
          Architecture: arm64
          Maintainer: Newbyte
          Depends: mutter, gnome-settings-daemon, pipewire-pulse | pulseaudio
          Provides: gnome-shell-mobile
          Replaces: gnome-shell
          Conflicts: gnome-shell
          Description: GNOME Shell Mobile
           GNOME Shell Mobile build for Debian Forky / Ubuntu 26.04.
          EOF

          dpkg-deb --build deb gnome-shell-mobile.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-shell-${{ matrix.os }}
          path: "*.deb"
          retention-days: 7
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gnome-shell-${{ matrix.os }}-${{ github.run_number }}
          name: GNOME Shell Mobile (${{ matrix.os }})
          body: |
            GNOME Shell Mobile build.
          draft: false
          prerelease: false
          files: "*.deb"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
