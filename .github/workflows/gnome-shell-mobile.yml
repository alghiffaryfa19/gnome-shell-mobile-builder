name: Build GNOME Shell Mobile (.deb)

on:
  workflow_run:
    workflows: ["Build Mutter Mobile (.deb)"]
    types:
      - completed
  push:
    paths:
      - ".github/workflows/gnome-shell-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      PKGVER: 48.0
      PKGREL: 6
      COMMIT: 48.mobile.0
      GVC_COMMIT: 47c47a423ff2f55bb038d92517e4782cf051496a

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential meson ninja-build pkg-config \
            asciidoc sassc unzip \
            libglib2.0-dev libgtk-3-dev \
            libgjs-dev libgstreamer1.0-dev \
            libibus-1.0-dev libcanberra-gtk3-dev \
            libnm-dev libxml2-dev libgcr-4-dev \
            libnma-dev libadwaita-1-dev \
            libpolkit-gobject-1-dev \
            libpipewire-0.3-dev \
            libstartup-notification0-dev \
            libgnome-desktop-3-dev \
            gobject-introspection \
            python3 python3-setuptools \
            wget build-essential meson ninja-build pkg-config \
            libglib2.0-dev libgirepository1.0-dev gobject-introspection \
            libgtk-4-dev libgjs-dev libxml2-dev \
            libpolkit-agent-1-dev libgnome-desktop-4-dev \
            libpango1.0-dev libecal2.0-dev libedataserver1.2-dev \
            libgcr-4-dev \
            libx11-dev \
            libnm-dev libsecret-1-dev \
            libpipewire-0.3-dev \
            libsystemd-dev systemd \
            libpulse-dev libasound2-dev \
            libadwaita-1-dev \
            gsettings-desktop-schemas-dev \
            python3 gjs gettext unzip wget pulseaudio pipewire-pulse

      # 🔥 Ambil dependency hasil build sebelumnya
      - name: "📥 Download MUTTER"
        id: download_mutter
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "mutter" \
            --pattern "*mutter*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "📥 Download GSD"
        id: download_gsd
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "gsd" \
            --pattern "*gsd*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies (local deb)
        run: |
          sudo dpkg -i *.deb || sudo apt -f install -y
          find / -name "mutter-clutter-16.pc" 2>/dev/null

      - name: Download source
        run: |
          wget -O gnome-shell-mobile.tar.gz https://gitlab.gnome.org/verdre/gnome-shell-mobile/-/archive/${COMMIT}/gnome-shell-mobile-${COMMIT}.tar.gz
          wget -O libgnome-volume-control.tar.gz https://gitlab.gnome.org/GNOME/libgnome-volume-control/-/archive/${GVC_COMMIT}/libgnome-volume-control-${GVC_COMMIT}.tar.gz

          # extract (NO wildcard)
          tar -xzf gnome-shell-mobile.tar.gz

          mkdir gvc
          tar -xzf libgnome-volume-control.tar.gz -C gvc --strip-components=1

      - name: Prepare
        run: |
          cd gnome-shell-mobile-${COMMIT}
          
          mkdir -p subprojects/gvc
          cp -r ../gvc/* subprojects/gvc/

          ls -lah

      - name: Build (systemd mode)
        run: |
          cd gnome-shell-mobile-${COMMIT}

          meson setup build \
            -Dsystemd=true \
            -Dtests=false

          meson compile -C build

      - name: Install
        run: |
          cd gnome-shell-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      - name: Cleanup
        run: |
          cd gnome-shell-mobile-${COMMIT}
          rm -f pkg/usr/share/applications/org.gnome.Extensions.desktop || true

      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r gnome-shell-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat <<EOF > deb/DEBIAN/control
          Package: gnome-shell-mobile
          Version: ${PKGVER}-${PKGREL}
          Architecture: amd64
          Maintainer: Newbyte
          Depends: mutter-mobile, gnome-settings-daemon-mobile
          Description: GNOME Shell Mobile (systemd)
          EOF

          dpkg-deb --build deb gnome-shell-mobile.deb

      - name: "📤 上传构建产物"
        uses: actions/upload-artifact@v4
        with:
          name: gnome-shell
          path: "*.deb"
          retention-days: 7
          if-no-files-found: error

      - name: "🏷️ 创建GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gnome_shell_mobile
          name: "GSM"
          body: |
            🧩 GSM
          draft: false
          prerelease: false
          files: "*.deb"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}