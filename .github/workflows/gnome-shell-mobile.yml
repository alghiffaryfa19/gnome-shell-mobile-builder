name: Build GNOME Shell Mobile (.deb)

on:
  workflow_run:
    workflows: ["Build Mutter Mobile (.deb)"]
    types:
      - completed
    paths:
      - ".github/workflows/gnome-shell-mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: debian:trixie

    env:
      PKGVER: 48.0
      PKGREL: 6
      COMMIT: 48.mobile.0
      GVC_COMMIT: 47c47a423ff2f55bb038d92517e4782cf051496a

    steps:
      # 🔹 Base tools
      - name: Install base tools
        run: |
          apt update
          apt install -y \
            git wget curl ca-certificates gnupg

      # 🔹 Build dependencies (Trixie)
      - name: Install dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources

          apt-get update

          apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config git gh

          apt-get build-dep -y \
            gnome-shell \
            mutter \
            gnome-settings-daemon

      # 🔥 Download MUTTER
      - name: "📥 Download MUTTER"
        id: download_mutter
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "mutter" \
            --pattern "*mutter*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Download GSD
      - name: "📥 Download GSD"
        id: download_gsd
        run: |
          
          # 使用GitHub CLI下载Release文件
          gh release download "gsd" \
            --pattern "*gsd*.deb" \
            --repo "${{ github.repository }}" \
            --clobber
          
          # 验证下载的文件
          DEB_COUNT=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ $DEB_COUNT -eq 0 ]; then
            echo "❌ 错误：未下载到任何内核包！"
            exit 1
          fi
          
          echo "✅ 成功下载 $DEB_COUNT 个内核包"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔥 Install dependency deb
      - name: Install GSD and Mutter Mobile
        run: |
          ls -lah *.deb

          echo "Install GSD first"
          apt-get install -y ./gsd*.deb \
            --allow-downgrades \
            -o Dpkg::Options::="--force-overwrite"

          PC_FILE="$(pkg-config --variable=pcfiledir gnome-settings-daemon)/gnome-settings-daemon.pc"
          sed -i 's/^Version:.*/Version: 48.mobile.0/' "$PC_FILE"

          echo "Install Mutter"
          apt-get install -y ./mutter*.deb \
            --allow-downgrades \
            -o Dpkg::Options::="--force-overwrite"

          echo "Verify versions:"
          pkg-config --modversion gnome-settings-daemon
          pkg-config --modversion libmutter-16
          pkg-config --modversion mutter-clutter-16

          test "$(pkg-config --modversion gnome-settings-daemon)" = "48.mobile.0"
          test "$(pkg-config --modversion libmutter-16)" = "48.mobile.0"

      - name: Install dependency debs
        run: |
          ls -lah *.deb

          for deb in *.deb; do
            echo "== $deb =="
            dpkg-deb -f "$deb" Package Version Architecture || true
          done

          apt-get install -y ./*.deb \
            --allow-downgrades \
            -o Dpkg::Options::="--force-overwrite"

          echo "Before patch:"
          pkg-config --modversion gnome-settings-daemon || true
          pkg-config --variable=pcfiledir gnome-settings-daemon || true

          PC_FILE="$(pkg-config --variable=pcfiledir gnome-settings-daemon)/gnome-settings-daemon.pc"

          echo "Using PC file: $PC_FILE"
          cat "$PC_FILE"

          sed -i 's/^Version:.*/Version: 48.mobile.0/' "$PC_FILE"

          echo "After patch:"
          cat "$PC_FILE"
          pkg-config --modversion gnome-settings-daemon

          test "$(pkg-config --modversion gnome-settings-daemon)" = "48.mobile.0"

      # 🔍 Debug (penting)
      - name: Verify pkg-config deps
        run: |
          pkg-config --modversion gnome-settings-daemon
          pkg-config --modversion libmutter-16
          pkg-config --modversion mutter-clutter-16
          pkg-config --modversion mutter-mtk-16
          pkg-config --modversion mutter-cogl-16

          pkg-config --cflags libmutter-16

      # 🔥 Download source
      # - name: Download source
      #   run: |
      #     wget -O gnome-shell-mobile.tar.gz \
      #       https://gitlab.gnome.org/verdre/gnome-shell-mobile/-/archive/${COMMIT}/gnome-shell-mobile-${COMMIT}.tar.gz

      #     wget -O gvc.tar.gz \
      #       https://gitlab.gnome.org/GNOME/libgnome-volume-control/-/archive/${GVC_COMMIT}/libgnome-volume-control-${GVC_COMMIT}.tar.gz

      #     tar -xzf gnome-shell-mobile.tar.gz

      #     mkdir gvc
      #     tar -xzf gvc.tar.gz -C gvc --strip-components=1

      - name: Clone source
        run: |
          git clone --recursive \
            https://gitlab.gnome.org/verdre/gnome-shell-mobile.git -b gnome-48-mobile \
            gnome-shell-mobile-${COMMIT}

          cd gnome-shell-mobile-${COMMIT}
          git checkout ${COMMIT}
          git submodule update --init --recursive

      # 🔧 Prepare
      # - name: Prepare
      #   run: |
      #     cd gnome-shell-mobile-${COMMIT}
      #     mkdir -p subprojects/gvc
      #     cp -r ../gvc/* subprojects/gvc/

      # 🚀 Build
      - name: Build
        run: |
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

          cd gnome-shell-mobile-${COMMIT}

          # fix systemd pkg-config name mismatch
          ln -s /usr/lib/aarch64-linux-gnu/pkgconfig/libsystemd.pc \
                /usr/lib/aarch64-linux-gnu/pkgconfig/systemd.pc || true

          pkg-config --modversion systemd || true

          mkdir -p /usr/lib/aarch64-linux-gnu/pkgconfig

          cat <<EOF | tee /usr/lib/aarch64-linux-gnu/pkgconfig/systemd.pc
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib/aarch64-linux-gnu
          includedir=\${prefix}/include

          Name: systemd
          Description: systemd
          Version: 253
          Libs: -lsystemd
          Cflags: -I\${includedir}

          systemduserunitdir=/usr/lib/systemd/user
          systemdsystemunitdir=/usr/lib/systemd/system
          EOF

          pkg-config --variable=systemduserunitdir systemd

          meson setup build \
            --prefix=/usr \
            -Dsystemd=true \
            -Dnetworkmanager=true \
            -Dcamera_monitor=false \
            -Dtests=false

          meson compile -C build

      # 📦 Install
      - name: Install
        run: |
          cd gnome-shell-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      # 🧹 Cleanup
      - name: Cleanup
        run: |
          cd gnome-shell-mobile-${COMMIT}
          rm -f pkg/usr/share/applications/org.gnome.Extensions.desktop || true

      # 📦 Create DEB
      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r gnome-shell-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat <<EOF > deb/DEBIAN/control
          Package: gnome-shell
          Version: ${PKGVER}-${PKGREL}
          Architecture: arm64
          Maintainer: Newbyte
          Depends: mutter, gnome-settings-daemon, pipewire-pulse | pulseaudio
          Description: GNOME Shell Mobile (systemd)
          EOF

          dpkg-deb --build deb gnome-shell-mobile.deb

      # 📤 Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-shell
          path: "*.deb"

      # 🏷️ Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gnome-shell-${{ github.run_number }}
          name: GNOME Shell Mobile
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
