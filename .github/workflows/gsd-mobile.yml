name: Build GSD Mobile (.deb)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gsd-mobile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        os: [debian]

    container:
      image: debian:forky

    env:
      PKGVER: 51.0
      PKGREL: 5
      COMMIT: mobile
      GVC_COMMIT: 50dbd7f381524ce7700f2aed64c144d3c45c87f9

    steps:
      - name: Install dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources

          apt-get update

          apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config git

          apt-get build-dep -y \
            gnome-shell \
            mutter \
            gnome-settings-daemon

      - name: Build and package gsettings-desktop-schemas
        run: |
          git clone https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas.git
          cd gsettings-desktop-schemas

          # Just use master for >= 51.alpha
          meson setup build --prefix=/usr
          meson compile -C build

          # Install locally for packaging
          DESTDIR=$(pwd)/pkg meson install -C build

          # Install to system for GSD
          meson install -C build

          cd ..
          mkdir -p deb-gsds/DEBIAN deb-gsds/usr
          cp -r gsettings-desktop-schemas/pkg/usr/* deb-gsds/usr/

          cat <<EOF > deb-gsds/DEBIAN/control
          Package: gsettings-desktop-schemas
          Version: 52.0-1
          Architecture: all
          Maintainer: Builder <builder@postmarketos.org>
          Provides: gsettings-desktop-schemas-dev
          Replaces: gsettings-desktop-schemas-dev, gsettings-desktop-schemas
          Description: GSettings desktop-wide schemas (latest backport)
          EOF

          dpkg-deb --build deb-gsds gsettings-desktop-schemas_52.0-all.deb

      # ✅ DOWNLOAD (EXPLICIT, NO WILDCARD)
      - name: Clone source
        run: |
          git clone --recursive \
            https://gitlab.gnome.org/World/MobileShell/gnome-settings-daemon-mobile.git -b mobile \
            gnome-settings-daemon-mobile-${COMMIT}

          cd gnome-settings-daemon-mobile-${COMMIT}
          git checkout ${COMMIT}
          git submodule update --init --recursive

      # ✅ EXTRACT AMAN
      # - name: Extract
      #   run: |
      #     tar -xzf gsd.tar.gz
      #     ls -lah

      # ✅ BUILD (SYSTEMD)
      - name: Build
        run: |
          cd gnome-settings-daemon-mobile-${COMMIT}

          meson setup build \
            -Dsystemd=true \
            -Db_lto=true \
            -Delogind=false

          meson compile -C build

      # ✅ INSTALL
      - name: Install
        run: |
          cd gnome-settings-daemon-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      # ✅ CREATE DEB
      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r gnome-settings-daemon-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat <<EOF > deb/DEBIAN/control
          Package: gnome-settings-daemon
          Version: ${PKGVER}-${PKGREL}
          Architecture: arm64
          Maintainer: Newbyte <newbyte@postmarketos.org>
          Depends: pulseaudio | pipewire-pulse
          Description: GNOME Settings Daemon Mobile (systemd)
          EOF

          dpkg-deb --build deb gsd-mobile.deb

      - name: "📤 上传构建产物"
        uses: actions/upload-artifact@v4
        with:
          name: gsd-${{ matrix.os }}
          path: "*.deb"
          retention-days: 7
          if-no-files-found: error

      - name: "🏷️ 创建GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gsd-${{ matrix.os }}
          name: "GSD (${{ matrix.os }})"
          body: |
            🧩 GSD
          draft: false
          prerelease: false
          files: "*.deb"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
