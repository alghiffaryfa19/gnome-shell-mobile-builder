name: Build GSD Mobile (.deb)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gsd-mobile.yml"

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-24.04-arm

    env:
      PKGVER: 48.0
      PKGREL: 4
      COMMIT: 48.mobile.0
      GVC_COMMIT: 47c47a423ff2f55bb038d92517e4782cf051496a

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential meson ninja-build pkg-config
          sudo apt build-dep gnome-shell mutter gnome-settings-daemon

      # ✅ DOWNLOAD (EXPLICIT, NO WILDCARD)
      - name: Download source
        run: |
          wget -O gsd.tar.gz \
            https://gitlab.gnome.org/verdre/gnome-settings-daemon-mobile/-/archive/${COMMIT}/gnome-settings-daemon-mobile-${COMMIT}.tar.gz

          ls -lah

      # ✅ EXTRACT AMAN
      - name: Extract
        run: |
          tar -xzf gsd.tar.gz
          ls -lah


      # ✅ BUILD (SYSTEMD)
      - name: Build
        run: |
          cd gnome-settings-daemon-mobile-${COMMIT}

          meson setup build \
            -Dsystemd=true \
            -Db_lto=true \
            -Delogind=false

          meson compile -C build

      # ✅ INSTALL
      - name: Install
        run: |
          cd gnome-settings-daemon-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      # ✅ CREATE DEB
      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r gnome-settings-daemon-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat <<EOF > deb/DEBIAN/control
          Package: gnome-settings-daemon-mobile
          Version: ${PKGVER}-${PKGREL}
          Architecture: arm64
          Maintainer: Newbyte <newbyte@postmarketos.org>
          Depends: pulseaudio | pipewire-pulse
          Description: GNOME Settings Daemon Mobile (systemd)
          EOF

          dpkg-deb --build deb gsd-mobile.deb

      - name: "📤 上传构建产物"
        uses: actions/upload-artifact@v4
        with:
          name: gsd
          path: "*.deb"
          retention-days: 7
          if-no-files-found: error

      - name: "🏷️ 创建GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gsd
          name: "GSD"
          body: |
            🧩 GSD
          draft: false
          prerelease: false
          files: "*.deb"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
