name: Build GSD Mobile (.deb)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gsd-mobile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, debian]
    
    container:
      image: ${{ matrix.os == 'ubuntu' && 'ubuntu:26.04' || 'debian:trixie' }}

    env:
      PKGVER: 51.0
      PKGREL: 5
      COMMIT: mobile
      GVC_COMMIT: 50dbd7f381524ce7700f2aed64c144d3c45c87f9

    steps:
      - name: Install dependencies
        run: |
          if [ "${{ matrix.os }}" = "ubuntu" ]; then
            sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          else
            sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          fi

          apt-get update

          apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config git

          apt-get build-dep -y \
            gnome-shell \
            mutter \
            gnome-settings-daemon

      - name: Build, install, and package libnotify
        run: |
          git clone https://gitlab.gnome.org/GNOME/libnotify.git -b 0.8.8
          cd libnotify
          meson setup build --prefix=/usr -Dtests=false -Dman=false -Dgtk_doc=false
          meson compile -C build
          
          # Install to a local dir for deb packaging
          DESTDIR=$(pwd)/pkg meson install -C build
          
          # Install to system so GSD can build against it
          meson install -C build
          
          # Create DEB package
          cd ..
          mkdir -p deb-libnotify/DEBIAN deb-libnotify/usr
          cp -r libnotify/pkg/usr/* deb-libnotify/usr/
          
          cat <<EOF > deb-libnotify/DEBIAN/control
          Package: libnotify4
          Version: 0.8.8-1
          Architecture: arm64
          Maintainer: Newbyte <newbyte@postmarketos.org>
          Provides: libnotify-dev, libnotify-bin, gir1.2-notify-0.7
          Replaces: libnotify-dev, libnotify-bin, gir1.2-notify-0.7
          Conflicts: libnotify-dev, libnotify-bin, gir1.2-notify-0.7
          Description: sends desktop notifications to a notification daemon (0.8.8 backport)
          EOF
          
          dpkg-deb --build deb-libnotify libnotify4-0.8.8-arm64.deb

      # ✅ DOWNLOAD (EXPLICIT, NO WILDCARD)
      - name: Clone source
        run: |
          git clone --recursive \
            https://gitlab.gnome.org/World/MobileShell/gnome-settings-daemon-mobile.git -b mobile \
            gnome-settings-daemon-mobile-${COMMIT}

          cd gnome-settings-daemon-mobile-${COMMIT}
          git checkout ${COMMIT}
          git submodule update --init --recursive

      # ✅ EXTRACT AMAN
      # - name: Extract
      #   run: |
      #     tar -xzf gsd.tar.gz
      #     ls -lah

      # ✅ BUILD (SYSTEMD)
      - name: Build
        run: |
          cd gnome-settings-daemon-mobile-${COMMIT}

          meson setup build \
            -Dsystemd=true \
            -Db_lto=true \
            -Delogind=false

          meson compile -C build

      # ✅ INSTALL
      - name: Install
        run: |
          cd gnome-settings-daemon-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      # ✅ CREATE DEB
      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r gnome-settings-daemon-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat <<EOF > deb/DEBIAN/control
          Package: gnome-settings-daemon
          Version: ${PKGVER}-${PKGREL}
          Architecture: arm64
          Maintainer: Newbyte <newbyte@postmarketos.org>
          Depends: pulseaudio | pipewire-pulse
          Description: GNOME Settings Daemon Mobile (systemd)
          EOF

          dpkg-deb --build deb gsd-mobile.deb

      - name: "📤 上传构建产物"
        uses: actions/upload-artifact@v4
        with:
          name: gsd-${{ matrix.os }}
          path: "*.deb"
          retention-days: 7
          if-no-files-found: error

      - name: "🏷️ 创建GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gsd-${{ matrix.os }}
          name: "GSD (${{ matrix.os }})"
          body: |
            🧩 GSD
          draft: false
          prerelease: false
          files: "*.deb"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
