name: Build GSD Mobile (.deb)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gsd-mobile.yml"

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        os: [debian]
        
    container:
      image: debian:forky

    env:
      PKGVER: 51~beta
      PKGREL: 1
      COMMIT: 51.beta
      GVC_COMMIT: 0a4eda0cdc2deb352bebc70ec697c42af46094e4

    steps:
      - name: Install dependencies
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config

          sudo apt-get build-dep -y \
            gnome-shell \
            mutter \
            gnome-settings-daemon

      # ✅ DOWNLOAD (EXPLICIT, NO WILDCARD)
      - name: Clone source
        run: |
          git clone --recursive \
            https://gitlab.gnome.org/World/MobileShell/gnome-settings-daemon-mobile.git -b main \
            gnome-settings-daemon-mobile-${COMMIT}

          cd gnome-settings-daemon-mobile-${COMMIT}
          git submodule update --init --recursive

      # ✅ EXTRACT AMAN
      # - name: Extract
      #   run: |
      #     tar -xzf gsd.tar.gz
      #     ls -lah


      # ✅ BUILD (SYSTEMD)
      - name: Build
        run: |
          cd gnome-settings-daemon-mobile-${COMMIT}

          meson setup build \
            -Dsystemd=true \
            -Db_lto=true \
            -Delogind=false

          meson compile -C build

      # ✅ INSTALL
      - name: Install
        run: |
          cd gnome-settings-daemon-mobile-${COMMIT}
          DESTDIR=$(pwd)/pkg meson install -C build

      # ✅ CREATE DEB
      - name: Create DEB
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r gnome-settings-daemon-mobile-${COMMIT}/pkg/usr/* deb/usr/

          cat <<EOF > deb/DEBIAN/control
          Package: gnome-settings-daemon
          Version: ${PKGVER}-${PKGREL}
          Architecture: arm64
          Maintainer: Newbyte <newbyte@postmarketos.org>
          Depends: pulseaudio | pipewire-pulse
          Description: GNOME Settings Daemon Mobile (systemd)
          EOF

          dpkg-deb --build deb gsd-mobile.deb

      - name: "📤 上传构建产物"
        uses: actions/upload-artifact@v4
        with:
          name: gsd
          path: "*.deb"
          retention-days: 7
          if-no-files-found: error

      - name: "🏷️ 创建GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: gsd-${PKGVER}
          name: "GSD"
          body: |
            🧩 GSD
          draft: false
          prerelease: false
          files: "*.deb"
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}